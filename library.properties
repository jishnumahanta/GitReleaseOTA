sentence=ESP32 OTA updater via GitHub Releases with SHA-256 integrity verification and automated release pipeline.
paragraph=Stream firmware from GitHub Releases with hardware-accelerated SHA-256 verification, optional ECDSA signature checking, semantic version comparison (1.10.0 > 1.9.0), non-blocking FreeRTOS version checks, thread-safe state, maintenance and failure callbacks to safely stop and resume hardware around a flash, and a one-command automated release script. No custom server required.
